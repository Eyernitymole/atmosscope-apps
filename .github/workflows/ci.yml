name: Validate AtmosScope

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - web/**
      - tests/**
      - package.json
      - android/**
      - windows/**
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  test:
    name: Node tests and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run repository tests
        run: npm test
      - name: Check JavaScript module syntax
        run: find web -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Install Chinese font for screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Open consultation in Chrome
        timeout-minutes: 4
        run: node scripts/browser-smoke-v1.6.mjs
      - name: Open ordinary weather in Chrome
        timeout-minutes: 4
        run: node scripts/browser-smoke-ordinary.mjs
      - name: Save browser screenshots and provider check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consultation-browser-smoke
          path: artifacts/
          if-no-files-found: warn

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - run: gradle --no-daemon -p android :app:assembleDebug
      - name: Verify bundled pages in APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/ordinary.html'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/index.html'

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: dotnet publish windows/AtmosScope/AtmosScope.csproj -c Release -r win-x64 --self-contained true -o windows/publish
      - name: Verify bundled pages in output
        shell: pwsh
        run: |
          if (-not (Test-Path windows/publish/Web/ordinary.html)) { throw 'Bundled ordinary page missing' }
          if (-not (Test-Path windows/publish/Web/index.html)) { throw 'Bundled professional page missing' }
      - name: Ensure WebView2 Runtime is available
        shell: pwsh
        run: ./scripts/install-webview2-runtime.ps1
      - name: Launch from protected install directory
        shell: pwsh
        timeout-minutes: 3
        run: ./scripts/windows-startup-smoke.ps1 -PublishDir windows/publish
      - name: Build preview installer
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Get-Content .release-version -Raw).Trim()
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$version" windows/installer/AtmosScope.iss
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path artifacts/AtmosScope-Windows-Setup.exe)) { throw 'Preview installer build failed' }
          Copy-Item artifacts/AtmosScope-Windows-Setup.exe "artifacts/AtmosScope-Windows-Setup-$version-preview.exe"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: windows-setup-preview
          path: artifacts/*-preview.exe
          if-no-files-found: error
          retention-days: 14
