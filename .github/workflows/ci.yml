name: Validate AtmosScope

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - web/**
      - tests/**
      - package.json
      - android/**
      - windows/**
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  test:
    name: Node tests and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run repository tests
        run: npm test
      - name: Check JavaScript module syntax
        run: find web -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Install Chinese font for screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Open consultation in Chrome
        timeout-minutes: 4
        run: node scripts/browser-smoke-v1.6.mjs
      - name: Open ordinary weather in Chrome
        timeout-minutes: 4
        run: node scripts/browser-smoke-ordinary.mjs
      - name: Save browser screenshots and provider check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consultation-browser-smoke
          path: artifacts/
          if-no-files-found: warn

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - run: gradle --no-daemon -p android :app:assembleDebug
      - name: Verify bundled pages in APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/ordinary.html'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/index.html'

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: dotnet build windows/AtmosScope/AtmosScope.csproj -c Release -r win-x64
      - name: Verify bundled pages in output
        shell: pwsh
        run: |
          if (-not (Get-ChildItem windows/AtmosScope/bin/Release -Recurse -Filter ordinary.html)) { throw 'Bundled ordinary page missing' }
          if (-not (Get-ChildItem windows/AtmosScope/bin/Release -Recurse -Filter index.html)) { throw 'Bundled professional page missing' }
