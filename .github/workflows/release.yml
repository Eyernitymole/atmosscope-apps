name: Build and release AtmosScope apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version override (x.y.z). Leave empty to use .release-version.
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .release-version
      - .github/workflows/release.yml
      - tests/**

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolve and validate version
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          FILE_VERSION="$(tr -d '\r\n ' < .release-version)"
          VERSION="${INPUT_VERSION:-$FILE_VERSION}"
          echo "event=$GITHUB_EVENT_NAME"
          echo "sha=$GITHUB_SHA"
          echo "file_version=$FILE_VERSION"
          echo "input_version=${INPUT_VERSION:-<empty>}"
          echo "resolved_version=$VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must use x.y.z"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Reject duplicate release tag
        env:
          VERSION: ${{ steps.resolve.outputs.value }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Bump .release-version or supply a different manual version."
            exit 1
          fi

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run repository checks
        run: npm test
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printenv ANDROID_KEYSTORE_BASE64 | base64 --decode > "$RUNNER_TEMP/atmosscope-release.jks"
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/atmosscope-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION: ${{ needs.version.outputs.value }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify and stage APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/AtmosScope-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: artifacts/AtmosScope-Android.apk
          if-no-files-found: error

  windows:
    name: Windows Setup
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows app
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.version.outputs.value }}
        run: dotnet publish windows/AtmosScope/AtmosScope.csproj -c Release -r win-x64 --self-contained true -o windows/publish /p:Version=$env:APP_VERSION
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.version.outputs.value }}
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$env:APP_VERSION" windows/installer/AtmosScope.iss
          if (-not (Test-Path artifacts/AtmosScope-Windows-Setup.exe)) { throw 'Installer output missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/AtmosScope-Windows-Setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: android-release
          path: release-assets
      - uses: actions/download-artifact@v5
        with:
          name: windows-release
          path: release-assets
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum AtmosScope-Android.apk AtmosScope-Windows-Setup.exe > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          gh release create "v$VERSION" \
            release-assets/AtmosScope-Android.apk \
            release-assets/AtmosScope-Windows-Setup.exe \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "AtmosScope v$VERSION" \
            --notes "专业图集 V4：在 V3 基础上新增 700/500 hPa 模式原生垂直速度、850 hPa 派生涡度、200 hPa 派生散度和 JMA/RSMC Tokyo 台风专题入口。涡度与散度由真实模式风场在采样网格上采用球面有限差分派生，并明确标记为诊断产品；不伪造台风路径。保留全部 V3 雷达、模式场、降水、强对流和探空功能。Windows 未使用商业代码签名证书时，系统可能显示 SmartScreen 提示。"
