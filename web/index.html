<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a1b2b" />
  <title>天衡气象 · 专业图集</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar"><div><p class="eyebrow">ATMOSSCOPE / PROFESSIONAL</p><h1>天衡气象 · 专业图集</h1><p class="subline">真实雷达 + 数值模式场，不生成伪造气象图。</p></div><div id="statusBadge" class="status-badge">准备就绪</div></header>
    <nav class="product-tabs" aria-label="专业图集产品">
      <button class="product-tab active" data-product="radar">天气雷达</button>
      <button class="product-tab" data-product="cloud">模式云场</button>
      <button class="product-tab" data-product="precip72">未来 72 小时累计降水</button>
      <button class="product-tab" data-product="wind850">850 hPa 风场</button>
      <button class="product-tab" data-product="height500">500 hPa 高度与温度场</button>
      <button class="product-tab" data-product="sounding">模式探空图</button>
    </nav>
    <section class="control-panel">
      <label id="modelControl" class="control"><span>模式</span><select id="modelSelect"><option value="cma">CMA GRAPES</option><option value="ecmwf">ECMWF IFS</option><option value="gfs">NCEP GFS</option></select></label>
      <label id="forecastControl" class="control"><span>预报时效</span><select id="forecastHour"></select></label>
      <label id="radarTimeControl" class="control hidden"><span>雷达时次</span><input id="radarTime" type="range" min="0" max="0" value="0" /></label>
      <button id="radarPlay" class="primary-btn hidden">播放雷达</button>
      <label id="precipRangeControl" class="control hidden"><span>累计时段</span><select id="precipRange"><option value="0-72">0–72 h</option><option value="0-24">0–24 h</option><option value="24-48">24–48 h</option><option value="48-72">48–72 h</option></select></label>
      <div id="soundingControl" class="sounding-control hidden"><label class="control"><span>城市搜索</span><input id="cityQuery" type="search" placeholder="如：广州" /></label><button id="citySearch" class="primary-btn">搜索</button><label class="control"><span>纬度</span><input id="soundLat" type="number" step="0.01" value="39.90" /></label><label class="control"><span>经度</span><input id="soundLon" type="number" step="0.01" value="116.40" /></label><button id="loadSounding" class="primary-btn">加载探空</button></div>
      <button id="refreshBtn" class="primary-btn">刷新当前产品</button>
    </section>
    <main class="workspace"><section class="map-card"><div id="map"></div><div id="soundingChart" class="hidden"></div><div id="loadingOverlay" class="loading hidden">正在获取真实气象数据…</div></section><aside class="info-card"><h2 id="productTitle">天气雷达</h2><p id="productDescription">RainViewer 组合雷达回波，展示最近约 2 小时雷达时次。</p><div class="meta-grid"><div><span>数据源</span><strong id="sourceText">RainViewer Radar</strong></div><div><span>有效时间</span><strong id="validTime">—</strong></div><div><span>模式/产品</span><strong id="modelText">实况雷达</strong></div></div><div class="legend-box"><div class="legend-title">图例</div><div id="legendBar" class="legend-bar radar"></div><div id="legendLabels" class="legend-labels"><span>弱</span><span>强</span></div></div><div id="productNotes" class="notes"><p>雷达覆盖范围由数据源决定；无覆盖区域不会伪造回波。</p></div></aside></main>
    <footer><span>模式数据：Open‑Meteo（CMA GRAPES / ECMWF / GFS）</span><span>雷达：RainViewer</span><span>底图：OpenStreetMap contributors</span></footer>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
